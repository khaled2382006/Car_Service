<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Spare Parts</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .back {
            text-decoration: none;
            color: white;
            background: #111827;
            padding: 10px 18px;
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
        }

        th,
        td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #111827;
            color: white;
        }

        .available {
            color: green;
            font-weight: bold;
        }

        .out {
            color: red;
            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="top">

        <h1>
            Spare Parts
        </h1>

        <a href="{% url 'app_home' %}"
           class="back">
            Dashboard
        </a>

    </div>


    <table>

        <thead>

            <tr>

                <th>
                    Part
                </th>

                <th>
                    Part Number
                </th>

                <th>
                    Quantity
                </th>

                <th>
                    Price
                </th>

            </tr>

        </thead>


        <tbody>


        {% for part in spare_parts %}

            <tr>

                <td>
                    {{ part.name }}
                </td>

                <td>
                    {{ part.part_number }}
                </td>

                <td>

                    {% if part.quantity > 0 %}

                        <span class="available">
                            {{ part.quantity }}
                        </span>

                    {% else %}

                        <span class="out">
                            Out of stock
                        </span>

                    {% endif %}

                </td>

                <td>
                    ${{ part.price }}
                </td>

            </tr>

        {% empty %}

            <tr>

                <td colspan="4">

                    No spare parts available.

                </td>

            </tr>

        {% endfor %}


        </tbody>


    </table>


</div>


</body>

</html>
